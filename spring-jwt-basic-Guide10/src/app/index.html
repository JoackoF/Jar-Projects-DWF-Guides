<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación JWT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .section {
            margin-bottom: 30px;
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .token-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
        }

        .token-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .user-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .user-info p {
            margin: 5px 0;
            color: #333;
        }

        .user-info strong {
            color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .response-data {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
        }

        .response-data pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Autenticación JWT</h1>

        <!-- SECCIÓN DE LOGIN -->
        <div id="loginSection" class="section active">
            <div id="loginAlert" class="alert"></div>

            <div class="form-group">
                <label for="username">Usuario:</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Ej: alex"
                    value="testuser"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Ingrese su contraseña"
                    value="testpassword"
                >
            </div>

            <button id="loginBtn" onclick="login()">Iniciar Sesión</button>
        </div>

        <!-- SECCIÓN AUTENTICADA -->
        <div id="authSection" class="section">
            <div id="authAlert" class="alert"></div>

            <div class="user-info">
                <p><strong>Usuario autenticado:</strong> <span id="authUsername"></span></p>
                <p><strong>Token expira en:</strong> <span id="tokenExpiration"></span></p>
            </div>

            <div>
                <label class="token-label">Tu Token JWT:</label>
                <div class="token-display" id="tokenDisplay"></div>
            </div>

            <button id="protectedBtn" onclick="callProtectedEndpoint()">
                📍 Consumir Endpoint Protegido
            </button>

            <div id="responseContainer" style="display: none; margin-top: 20px;">
                <label class="token-label">Respuesta del servidor:</label>
                <div class="response-data">
                    <pre id="responseData"></pre>
                </div>
            </div>

            <div class="button-group" style="margin-top: 20px;">
                <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        // Verificar si hay sesión activa al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwtToken');
            if (token) {
                showAuthSection();
            }
        });

        // Función para cambiar entre secciones
        function switchSection(section) {
            document.querySelectorAll('.section').forEach(s => {
                s.classList.remove('active');
            });
            document.getElementById(section).classList.add('active');
        }

        // Mostrar alerta
        function showAlert(containerId, message, type) {
            const alert = document.getElementById(containerId);
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // LOGIN
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showAlert('loginAlert', '⚠️ Por favor complete todos los campos', 'danger');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span> Autenticando...';

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const token = await response.text();

                if (!response.ok || token.includes('Error')) {
                    showAlert('loginAlert', '❌ Error de autenticación. Verifique sus credenciales', 'danger');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Iniciar Sesión';
                    return;
                }

                // Guardar token en localStorage
                localStorage.setItem('jwtToken', token);
                localStorage.setItem('username', username);

                showAlert('loginAlert', '✅ ¡Autenticación exitosa!', 'success');

                setTimeout(() => {
                    showAuthSection();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showAlert('loginAlert', '❌ Error de conexión con el servidor', 'danger');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Iniciar Sesión';
            }
        }

        // Mostrar sección autenticada
        function showAuthSection() {
            const token = localStorage.getItem('jwtToken');
            const username = localStorage.getItem('username');

            // Decodificar el payload del JWT para obtener la fecha de expiración
            const parts = token.split('.');
            const payload = JSON.parse(atob(parts[1]));
            const expirationDate = new Date(payload.exp * 1000);
            const timeRemaining = formatTimeRemaining(expirationDate);

            document.getElementById('authUsername').textContent = username;
            document.getElementById('tokenExpiration').textContent = timeRemaining;
            document.getElementById('tokenDisplay').textContent = token;

            switchSection('authSection');
        }

        // Formatear tiempo restante
        function formatTimeRemaining(date) {
            const now = new Date();
            const diff = date - now;
            const hours = Math.floor(diff / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            return `${hours}h ${minutes}m`;
        }

        // Consumir endpoint protegido
        async function callProtectedEndpoint() {
            const token = localStorage.getItem('jwtToken');
            const protectedBtn = document.getElementById('protectedBtn');
            const responseContainer = document.getElementById('responseContainer');
            const responseData = document.getElementById('responseData');

            protectedBtn.disabled = true;
            protectedBtn.innerHTML = '<span class="loading"></span> Cargando...';

            try {
                // Nota: Como ejemplo usamos /api/auth/profile (debes crear este endpoint en tu backend)
                // O puedes usar cualquier endpoint protegido que hayas creado
                const response = await fetch(`${API_URL}/api/auth/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.text();

                if (response.ok) {
                    responseContainer.style.display = 'block';
                    try {
                        const jsonData = JSON.parse(data);
                        responseData.textContent = JSON.stringify(jsonData, null, 2);
                    } catch {
                        responseData.textContent = data;
                    }
                    showAlert('authAlert', '✅ Endpoint protegido consumido exitosamente', 'success');
                } else {
                    responseContainer.style.display = 'block';
                    responseData.textContent = `Error ${response.status}: ${data}`;
                    showAlert('authAlert', '❌ Error al consumir el endpoint', 'danger');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('authAlert', '❌ Error de conexión. Asegúrate que el servidor está corriendo', 'danger');
            } finally {
                protectedBtn.disabled = false;
                protectedBtn.innerHTML = '📍 Consumir Endpoint Protegido';
            }
        }

        // LOGOUT
        function logout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('username');
            document.getElementById('loginAlert').innerHTML = '';
            document.getElementById('language').value = '';
            document.getElementById('password').value = '';
            switchSection('loginSection');
            showAlert('loginAlert', '✅ Sesión cerrada correctamente', 'success');
        }
    </script>
</body>
</html>
